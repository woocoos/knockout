jwt:
  signingMethod: "HS256"
  signingKey: "secret"

auth:
  stateTokenTTL: 5m
  stateTokenSecret: "secret"
  jwt: &jwt
    signingMethod: "HS256"
    signingKey: "secret"
    tokenTTL: 1h
    refreshTokenTTL: 1h

authz:
  autoSave: true
  watcherOptions:
    options:
      addr: "127.0.0.1:6379"
      channel: "/casbin"
  model: "../test/testdata/etc/rbac_model.conf"

store:
  portal:
    driverName: sqlite3
    dsn: "file:portal?mode=memory&cache=shared&_fk=1"
  redis: &redis
    addrs:
      - 127.0.0.1:6379

cache:
  redis:
    driverName: redis
    <<: *redis
    local:
      size: 1000
      ttl: 100s

entcache:
  hashQueryTTL: 1s

web:
  engine:
    routerGroups:
    - default:
        middlewares:
        - errorHandle:
        - jwt:
#                tokenStoreKey: redis
            exclude:
              - "/spm/auth"
            <<: *jwt
    - graphql:
        basePath: "/graphql"
        middlewares:
          - tenant:
          - graphql:
              group: "/graphql"
              withAuthorization: true
              appCode: "resource"
errors:
  errorCodeMap:
    10000: "用户名或密码错误"
    10001: "旧密码错误"
    10002: "账号禁止登录"
    10003: "账号验证错误"
    10004: "密码错误"
    10005: "新密码不能与最近一次使用的密码相同"
    10006: "密码已过期，请重置密码或联系客服修改密码恢复"
    10007: "账号已锁定，请重置密码或联系客服修改密码解除锁定"
    10008: "验证码错误"
    10009: "身份验证码错误"
    10010: "MFA未激活"
    10011: "MFA未启用"
    10012: "无效的令牌"
    10013: "邮箱不存在"
    10014: "未找到邮箱，请确认邮箱是否正确"
    10015: "组织未找到"
    10016: "无效的权限"
    10017: "没有登录权限"
    10018: "无效的SPM"
    10019: "文件凭证不存在"
    10020: "不支持的验证方式"
    10021: "验证码失效"
    10022: "密码错误，您还可以尝试%d次"
    10023: "登录设备超过%d台限制，请前往旧设备删除登录设备后登录"
    10024: "登录账号不存在"

job:
  password:
    expiredLimitLogin: false
    # 过期后提醒间隔，单位是天
    expiredRemindInterval: 30
    # 忽略的凭证，不处理过期
    ignoreIdentities:
      - "deo_admin"
    cronSpec: "0 */2 * * * *"
    # 密码有效天数
    effectiveDays: "365d"
    # 常规提醒修改密码，离到期日还比较长
    remindTimePeriod: "270d|180d|90d|30d"
    # 即将到期提修改密码
    expiringTimePeriod: "14d|7d|3d|1d"

