extend type Query {
    """获取全局ID,开发用途"""
    globalID(type: String!, id: ID!): GID
    """获取登录用户的信息"""
    viewer: User!
    """用户组"""
    orgGroups(
        after: Cursor
        first: Int
        before: Cursor
        last: Int
        orderBy: OrgRoleOrder
        where: OrgRoleWhereInput
    ): OrgRoleConnection!
    """用户组组成员"""
    orgRoleUsers(
        roleID: ID!
        after: Cursor
        first: Int
        before: Cursor
        last: Int
        orderBy: UserOrder
        where: UserWhereInput
    ): UserConnection!
    """角色"""
    orgRoles(
        after: Cursor
        first: Int
        before: Cursor
        last: Int
        orderBy: OrgRoleOrder
        where: OrgRoleWhereInput
    ): OrgRoleConnection!
    """应用角色授权的组织列表"""
    appRoleAssignedToOrgs(roleID:ID!,where:OrgWhereInput):[Org!]!
    """应用策略授权的组织列表"""
    appPolicyAssignedToOrgs(policyID:ID!,where:OrgWhereInput):[Org!]!
    """权限策略引用列表"""
    orgPolicyReferences(
        orgID: ID
        policyID:ID!
        after: Cursor
        first: Int
        before: Cursor
        last: Int
        orderBy: PermissionOrder
        where: PermissionWhereInput
    ):PermissionConnection!
    """获取应用资源模板"""
    appResources(
        appID:ID!
        after: Cursor
        first: Int
        before: Cursor
        last: Int
        orderBy: AppResOrder
        where: AppResWhereInput
    ):AppResConnection!
    """获取组织应用资源模板"""
    orgAppResources(
        appID:ID!
        after: Cursor
        first: Int
        before: Cursor
        last: Int
        orderBy: AppResOrder
        where: AppResWhereInput
    ):AppResConnection!
    """用户加入的用户组"""
    userGroups(
        orgID: ID
        userID:ID!
        after: Cursor
        first: Int
        before: Cursor
        last: Int
        orderBy: OrgRoleOrder
        where: OrgRoleWhereInput
    ):OrgRoleConnection!
    """用户加入的角色"""
    userRoles(
        orgID: ID
        userID:ID!
        after: Cursor
        first: Int
        before: Cursor
        last: Int
        orderBy: OrgRoleOrder
        where: OrgRoleWhereInput
    ):OrgRoleConnection!
    """用户继承用户组的权限策略"""
    userExtendGroupPolicies(
        orgID: ID
        userID:ID!
        after: Cursor
        first: Int
        before: Cursor
        last: Int
        orderBy: PermissionOrder
        where: PermissionWhereInput
    ):PermissionConnection!
    """用户继承角色的权限策略"""
    userExtendRolePolicies(
        orgID: ID
        userID:ID!
        after: Cursor
        first: Int
        before: Cursor
        last: Int
        orderBy: PermissionOrder
        where: PermissionWhereInput
    ):PermissionConnection!
    """用户菜单"""
    userMenus(appCode:String!):[AppMenu!]!
    """获取用户所有权限"""
    userPermissions(where: AppActionWhereInput):[AppAction!]!
    """检测权限"""
    checkPermission(
        """appCode + ":" + action"""
        permission:String!
    ):Boolean!
    """检测权限 ko-proxy使用"""
    checkPermissionByJwt(
        jwtStr:String!
        orgID:ID!
        action:String!
        appCode:String!
    ):Boolean!
    """组织策略可授权的appActions"""
    orgAppActions(appCode:String!):[AppAction!]!
    """用户加入的root组织"""
    userRootOrgs:[Org!]!
    """组织回收站列表"""
    orgRecycleUsers(
        after: Cursor
        first: Int
        before: Cursor
        last: Int
        orderBy: UserOrder
        where: UserWhereInput
    ):UserConnection!
    """获取组织用户偏好"""
    orgUserPreference: OrgUserPreference
    """用户授权的应用列表"""
    userApps: [App!]!
    """根据ref_code获取数据字典,用于批量获取"""
    appDictByRefCode(
        """ref_code规则：<appCode:appDictCode>"""
        refCodes: [String!]!
    ): [AppDict!]!
    """根据ref_code获取数据字典值"""
    appDictItemByRefCode(
        """ref_code规则：<appCode:appDictCode>"""
        refCode: String!
    ):[AppDictItem!]!
    """检测应用登录授权"""
    appAccess(appCode:String!):Boolean!
    """检测应用登录授权,针对获取token处理"""
    appAccessForToken(appCode:String!,clientID:String!,clientSecret:String!):Boolean!
    """获取文件凭证"""
    fileIdentitiesForApp(where: FileIdentityWhereInput): [FileIdentityForApp!]!
    """获取凭证AccessKeySecret"""
    fileIdentityAccessKeySecret(id: ID!): String!
    """成员列表"""
    userMembers(
        after: Cursor
        first: Int
        before: Cursor
        last: Int
        orderBy: UserOrder
        where: UserWhereInput
    ):UserConnection!
    """应用策略视图"""
    appPolicyView(appCode: String!): [AppPolicyView!]!
    """登录用户策略视图"""
    orgPolicyView(appCode: String!,orgID: ID): [AppPolicyViewOrgPolicy!]!
    """应用策略视图角色选中项"""
    appPolicyViewRoleAssigned(appRoleID: ID!): [AppPolicyView!]!
    """组织策略视图角色/用户组选中项"""
    orgPolicyViewRoleAssigned(orgRoleID: ID!,appCode: String!,orgID: ID): [AppPolicyView!]!
    """组织策略视图用户选择项"""
    orgPolicyViewUserAssigned(userID: ID!,appCode: String!,orgID: ID): [AppPolicyView!]!
    """获取租户密码策略"""
    userPasswordPolicy: UserPasswordPolicy
    """获取组织用户"""
    orgUsers(
        """组织ID或者部门ID"""
        orgID: ID!
        after: Cursor
        first: Int
        before: Cursor
        last: Int
        orderBy: UserOrder
        where: UserWhereInput
    ):UserConnection!
}