<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>系统初始化</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    padding: 40px;
    width: 460px;
    max-width: 90vw;
  }
  .card h1 {
    font-size: 24px;
    color: #1a1a2e;
    margin-bottom: 8px;
  }
  .card p.subtitle {
    color: #666;
    font-size: 14px;
    margin-bottom: 28px;
  }
  .form-group {
    margin-bottom: 18px;
  }
  .form-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #333;
    margin-bottom: 6px;
  }
  .form-group input, .form-group select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 14px;
    transition: border-color 0.2s;
    outline: none;
  }
  .form-group input:focus, .form-group select:focus {
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
  }
  .form-group .hint {
    font-size: 12px;
    color: #999;
    margin-top: 4px;
  }
  .form-row {
    display: flex;
    gap: 12px;
  }
  .form-row .form-group {
    flex: 1;
  }
  .btn {
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
    margin-top: 8px;
  }
  .btn:hover { opacity: 0.9; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-secondary {
    background: #f0f0f0;
    color: #333;
  }
  .msg {
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 13px;
    margin-top: 16px;
    display: none;
  }
  .msg.error { display: block; background: #fff2f0; border: 1px solid #ffccc7; color: #cf1322; }
  .msg.success { display: block; background: #f6ffed; border: 1px solid #b7eb8f; color: #389e0d; }
  .msg.info { display: block; background: #e6f7ff; border: 1px solid #91d5ff; color: #096dd9; }
  .steps {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
  }
  .steps .step {
    flex: 1;
    height: 4px;
    border-radius: 2px;
    background: #e8e8e8;
    transition: background 0.3s;
  }
  .steps .step.active { background: #667eea; }
  .steps .step.done { background: #52c41a; }
  .section-title {
    font-size: 14px;
    font-weight: 600;
    color: #667eea;
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid #eee;
  }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="card">
  <h1>系统初始化</h1>
  <p class="subtitle">首次安装, 请配置数据库和管理员账户</p>
  <div class="steps">
    <div class="step active" id="step1"></div>
    <div class="step" id="step2"></div>
    <div class="step" id="step3"></div>
  </div>
  <form id="setupForm">
    <!-- 数据库配置 -->
    <div class="section-title">数据库配置</div>
    <div class="form-group">
      <label for="driverName">数据库类型</label>
      <select id="driverName" name="driverName">
        <option value="mysql">MySQL</option>
        <option value="sqlite3">SQLite</option>
      </select>
    </div>
    <div class="form-group">
      <label for="dsn">连接字符串</label>
      <input type="text" id="dsn" name="dsn" placeholder="user:password@tcp(host:port)/dbname" required>
      <div class="hint" id="dsnHint">MySQL: user:pass@tcp(localhost:3306)/dbname?parseTime=true</div>
    </div>
    <button type="button" class="btn btn-secondary" id="testDbBtn">测试连接</button>

    <!-- 管理员配置 -->
    <div id="adminSection" class="hidden">
      <div class="section-title" style="margin-top: 24px;">管理员账户</div>
      <div class="form-row">
        <div class="form-group">
          <label for="adminPrincipalName">登录名</label>
          <input type="text" id="adminPrincipalName" name="adminPrincipalName" value="admin" required>
        </div>
        <div class="form-group">
          <label for="adminDisplayName">显示名称</label>
          <input type="text" id="adminDisplayName" name="adminDisplayName" value="Administrator" required>
        </div>
      </div>
      <div class="form-group">
        <label for="adminEmail">邮箱</label>
        <input type="email" id="adminEmail" name="adminEmail" value="admin@localhost" required>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="adminPassword">密码</label>
          <input type="password" id="adminPassword" name="adminPassword" required minlength="6">
          <div class="hint">至少 6 位字符</div>
        </div>
        <div class="form-group">
          <label for="confirmPassword">确认密码</label>
          <input type="password" id="confirmPassword" required minlength="6">
        </div>
      </div>
      <button type="submit" class="btn" id="submitBtn">开始安装</button>
    </div>
  </form>
  <div class="msg" id="msg"></div>
</div>
<script>
const form = document.getElementById('setupForm');
const msg = document.getElementById('msg');
const submitBtn = document.getElementById('submitBtn');
const testDbBtn = document.getElementById('testDbBtn');
const adminSection = document.getElementById('adminSection');
const driverSelect = document.getElementById('driverName');
const dsnInput = document.getElementById('dsn');
const dsnHint = document.getElementById('dsnHint');

let dbVerified = false;

function showMsg(text, type) {
  msg.textContent = text;
  msg.className = 'msg ' + type;
}

function setStep(n) {
  for (let i = 1; i <= 3; i++) {
    const el = document.getElementById('step' + i);
    el.className = 'step' + (i < n ? ' done' : i === n ? ' active' : '');
  }
}

// 更新 DSN 提示
driverSelect.addEventListener('change', () => {
  if (driverSelect.value === 'sqlite3') {
    dsnHint.textContent = 'SQLite: file:path/to/db.sqlite?cache=shared&_fk=1';
    dsnInput.placeholder = 'file:data.db?cache=shared&_fk=1';
  } else {
    dsnHint.textContent = 'MySQL: user:pass@tcp(localhost:3306)/dbname?parseTime=true';
    dsnInput.placeholder = 'user:password@tcp(host:port)/dbname';
  }
  dbVerified = false;
  adminSection.classList.add('hidden');
});

// 检查是否已初始化
(async function checkStatus() {
  try {
    const res = await fetch('/setup/status');
    const data = await res.json();
    if (data.initialized) {
      showMsg('系统已初始化', 'info');
      return;
    }
  } catch (e) { /* ignore */ }
})();

// 测试数据库连接
testDbBtn.addEventListener('click', async () => {
  const driverName = driverSelect.value;
  const dsn = dsnInput.value;
  if (!dsn) {
    showMsg('请输入连接字符串', 'error');
    return;
  }

  testDbBtn.disabled = true;
  testDbBtn.textContent = '测试中...';
  showMsg('', '');

  try {
    const res = await fetch('/setup/test-db', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ driverName, dsn }),
    });
    const data = await res.json();
    if (data.success) {
      showMsg('数据库连接成功', 'success');
      dbVerified = true;
      adminSection.classList.remove('hidden');
      setStep(2);
    } else {
      showMsg('连接失败: ' + data.error, 'error');
      dbVerified = false;
    }
  } catch (err) {
    showMsg('测试请求失败: ' + err.message, 'error');
  } finally {
    testDbBtn.disabled = false;
    testDbBtn.textContent = '测试连接';
  }
});

// 提交安装
form.addEventListener('submit', async (e) => {
  e.preventDefault();

  if (!dbVerified) {
    showMsg('请先测试数据库连接', 'error');
    return;
  }

  const password = document.getElementById('adminPassword').value;
  const confirm = document.getElementById('confirmPassword').value;
  if (password !== confirm) {
    showMsg('两次输入的密码不一致', 'error');
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = '安装中...';
  setStep(3);

  const body = {
    driverName: driverSelect.value,
    dsn: dsnInput.value,
    adminPrincipalName: document.getElementById('adminPrincipalName').value,
    adminDisplayName: document.getElementById('adminDisplayName').value,
    adminEmail: document.getElementById('adminEmail').value,
    adminPassword: password,
  };

  try {
    const res = await fetch('/setup/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) {
      throw new Error(data.error || '安装失败');
    }
    showMsg('安装成功! 系统正在重启...', 'success');
    submitBtn.textContent = '安装完成';
    // 等待系统重启后刷新页面
    setTimeout(() => window.location.reload(), 5000);
  } catch (err) {
    showMsg(err.message, 'error');
    submitBtn.disabled = false;
    submitBtn.textContent = '重新安装';
    setStep(2);
  }
});
</script>
</body>
</html>
