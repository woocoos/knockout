namespace: default
appName: auth
version: 0.0.1
development: true
# use open telemetry
#otel:
#  traceExporter: otlp
#  otlp:
#    endpoint: "127.0.0.1:4317"
#    client:
#      dialOption:
#        - timeout: 5s
authz:
  expireTime: 10s
  autoSave: false
  watcherOptions:
    options:
      addr: "127.0.0.1:6379"
      db: 1
    ignoreSelf: true
    channel: "/casbin"
  model: "etc/rbac_model.conf"

auth:
  captchaTimes: 3 # if login fail times, captcha will force show
  captchaTTL: 1m # captcha ttl
  loginFailTimes: 10 # login fail times will lock account
  loginFailLockTime: 10m # login fail lock time
  stateTokenTTL: 20m
  stateTokenSecret: "secret"
  spmTTL: 5s
  jwt: &jwt
    signingMethod: "HS256"
    signingKey: "e262608e-926d-4a4a-9b53-a25a96b95689"
    tokenTTL: 1h
    refreshTokenTTL: 168h
  pwdPolicy:
    # 密码最短长度，长度应在6-32位之间
    length: 6
    # 必须包含的元素，异或：1-小写字母，2-大写字母，4-数字，8-符号
    includeElement: 3
    # 最少包含的不同字符数，最多8个，0代表不限制
    includeChar: 4
    # 是否允许包含用户名
    allowIncludeUserName: false
    # 有效天数，最大1095天，0代表不过期
    invalidDay: 30
    # 过期后是否限制登录
    invalidLoginLimit: false
    # 一小时内密码错误最多尝试次数，最大32次，0代表不限次数
    retry: 5
    # 密码错误多少次出现验证码，最大5次，0代表不出现验证码
    captchaTimes: 3

web:
  server:
    addr: 127.0.0.1:10070
  engine:
    routerGroups:
      - default:
          middlewares:
            - cors:
                allowOrigins: [ '*' ]
                allowHeaders: [ "*" ]
            - accessLog:
            - recovery:
            - errorHandle:
            - jwt:
                #tokenStoreKey: redis
                exclude:
                  - "/login/auth"
                  - "/login/old-auth"
                  - "/login/mfaqr.png"
                  - "/login/verify-factor"
                  - "/login/reset-password"
                  - "/captcha"
                  - "/forget-pwd/begin"
                  - "/forget-pwd/verify-email"
                  - "/forget-pwd/send-email"
                  - "/forget-pwd/verify-mfa"
                  - "/forget-pwd/reset"
                  - "/spm/auth"
                  - "/token"
                <<: *jwt
grpc:
  server:
    addr: 127.0.0.1:10080
    engine:
      - unaryInterceptors:
          - accessLog:
          - recovery:
  #  registry:
  #    scheme: polaris
  #    ttl: 10s
  #    polaris:
  #      global:
  #        serverConnector:
  #          addresses:
  #            - 127.0.0.1:8091


store:
  portal:
    driverName: mysql
    dsn: "root:@tcp(localhost:3306)/portal?parseTime=true&loc=Local"
  redis: &redis
    addrs:
      - 127.0.0.1:6379
    db: 1

cache:
  redis:
    driverName: redis
    <<: *redis
    local:
      size: 1000
      ttl: 100s

entcache:
  hashQueryTTL: 5s

kosdk:
  client:
    timeout: 2s
    oauth2:
      clientID: 206734260394752
      clientSecret: T2UlqISVFq4DR9InXamj3l74iWdu3Tyr
      endpoint:
        tokenURL: http://127.0.0.1:10070/token
      scopes:
      storeKey: redis
  signer:
    authScheme: "KO-HMAC-SHA1"
    authHeaders: [ "timestamp", "nonce" ]
    signedLookups:
      accessToken: "header:authorization>bearer"
      timestamp:
      nonce:
      url: CanonicalUri
    nonceLen: 12
  plugin:
    fs:
    msg:
      basePath: "http://127.0.0.1:10072"




