namespace: default
appName: adminx
version: 0.0.1
development: true
includeFiles:
#  - "etc/local.yaml"
log:
  withTraceID: true
  traceIDKey: "traceId"
  cores:
    - level: debug
      outputPaths:
        - stdout
  rotate:
    localtime: true
# use open telemetry
#otel:
#  traceExporter: otlp
#  otlp:
#    endpoint: "127.0.0.1:4317"
#    client:
#      dialOption:
#        - timeout: 5s
authz:
  expireTime: 10s
  autoSave: true
  watcherOptions:
    options:
      addr: "127.0.0.1:6379"
      db: 1
    ignoreSelf: true
    channel: "/casbin"
  model: "etc/rbac_model.conf"
  # 数据条件本地缓存配置
  cache:
    size: 1000
    ttl: 1m
    
jwt: &jwt
  signingMethod: "HS256"
  signingKey: "e262608e-926d-4a4a-9b53-a25a96b95689"

web:
  server:
    addr: :8080
  engine:
    routerGroups:
      - default:
          middlewares:
            - cors:
                allowOrigins: ['*']
                allowHeaders: ["*"]
            - accessLog:
                exclude:
                  - IntrospectionQuery
            - recovery:
            - errorHandle:
            - gzip:
      - graphql:
          basePath: "/graphql"
          middlewares:
            - jwt: *jwt
            - tenant:
            - graphql:
                group: "/graphql"
                withAuthorization: false
                appCode: "resource"
                middlewares:
                  operation:
                    # - tokenSign: # 利用IDE开发时,可注释
                docHeader: ## dev mode, remove in production, set the value in your .env.local
                  X-Tenant-ID: ${TENANT}
                  Authorization: ${AUTHORIZATION}

store:
  portal:
    driverName: mysql
    dsn: "root:@tcp(localhost:3306)/portal?parseTime=true&loc=Local"
  redis: &redis
    addrs:
      - 127.0.0.1:6379
    db: 1

cache:
  redis:
    driverName: redis
    <<: *redis
    local:
      size: 1000
      ttl: 100s

entcache:
  hashQueryTTL: 3s

kosdk:
  client:
    timeout: 2s
    oauth2:
      clientID: 206734260394752
      clientSecret: T2UlqISVFq4DR9InXamj3l74iWdu3Tyr
      endpoint:
        tokenURL: http://127.0.0.1:10070/token
      scopes:
      storeKey: redis
  signer:
    authScheme: "KO-HMAC-SHA1"
    authHeaders: [ "timestamp", "nonce" ]
    signedLookups:
      accessToken: "header:authorization>bearer"
      timestamp:
      nonce:
      url: CanonicalUri
    nonceLen: 12
  plugin:
    msg:
      basePath: "http://127.0.0.1:10072/api/v2"

adminx:
  pwdPolicy:
    # 密码最短长度，长度应在6-32位之间
    length: 6
    # 必须包含的元素，异或：1-小写字母，2-大写字母，4-数字，8-符号
    includeElement: 3
    # 最少包含的不同字符数，最多8个，0代表不限制
    includeChar: 4
    # 是否允许包含用户名
    allowIncludeUserName: false
    # 有效天数，最大1095天，0代表不过期
    invalidDay: 365
    # 过期后是否限制登录
    invalidLoginLimit: true
    # 一小时内密码错误最多尝试次数，最大32次，0代表不限次数
    retry: 5
    # 密码错误多少次出现验证码，最大5次，0代表不出现验证码
    captchaTimes: 3

